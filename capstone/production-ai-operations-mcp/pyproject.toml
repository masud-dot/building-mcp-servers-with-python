[project]
name = "production-ai-operations-mcp"
version = "1.0.0"
description = "An AI operations MCP server."
requires-python = ">=3.10"
dependencies = [
    "mcp==2.1.1",
    "httpx2",
    "pydantic-settings>=2.15",
    "psycopg[binary,pool]>=3.2",
    "pyjwt[crypto]>=2.10",
]

[dependency-groups]
dev = ["pytest>=8", "anyio>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "anyio",
    "integration: needs PostgreSQL (see README)",
]
