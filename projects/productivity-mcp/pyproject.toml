[project]
name = "productivity-mcp"
version = "1.0.0"
description = "A productivity MCP server."
requires-python = ">=3.10"
dependencies = [
    "mcp==2.1.1",
    "pydantic-settings>=2.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/productivity"]

[dependency-groups]
dev = ["pytest>=8", "anyio>=4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# anyio's plugin runs fixtures and tests in the same task,
# which the SDK's cancel scopes require.
markers = ["anyio"]
