[project]
name = "qa-automation-mcp"
version = "0.1.0"
description = "A QA automation MCP server."
requires-python = ">=3.10"
dependencies = [
    "mcp==2.1.1",
    # Imported directly by config.py. Not a transitive
    # dependency of mcp, so it must be declared.
    "pydantic-settings>=2.15",
    "httpx2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qaops"]

[dependency-groups]
dev = ["pytest>=8", "anyio>=4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["anyio"]
