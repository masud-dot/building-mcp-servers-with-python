# Brings up the warehouse this chapter reads from.
#   docker compose up -d
services:
  warehouse:
    image: postgres:16
    environment:
      POSTGRES_DB: warehouse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports: ["5432:5432"]
    volumes:
      - ./sql/001-schema.sql:/docker-entrypoint-initdb.d/001.sql:ro

  # Chapter 28: three interchangeable instances. No affinity,
  # no shared session store, nothing pinned.
  server:
    build: .
    deploy:
      replicas: 3
    environment:
      DATAENG_DSN: ${DATAENG_DSN:?set in .env}
      DATAENG_WRITER_DSN: ${DATAENG_WRITER_DSN:?set in .env}
      DATAENG_AUTH_ENABLED: "true"
      DATAENG_AUTH_ISSUER: ${DATAENG_AUTH_ISSUER:?}
      DATAENG_AUTH_AUDIENCE: ${DATAENG_AUTH_AUDIENCE:?}
      DATAENG_AUTH_PUBLIC_KEY: ${DATAENG_AUTH_PUBLIC_KEY:?}
    depends_on: [warehouse]
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request as u;
              u.urlopen('http://localhost:8000/livez')"]
      interval: 10s
      timeout: 2s
      retries: 3
      start_period: 5s
