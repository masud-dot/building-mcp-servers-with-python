[project]
name = "data-engineering-mcp"
version = "0.1.0"
description = "A read-only data engineering MCP server."
requires-python = ">=3.10"
dependencies = [
    "pydantic-settings>=2.15",
    "mcp==2.1.1",
    "httpx2",
    "psycopg[binary,pool]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dataeng"]

[dependency-groups]
dev = ["pytest>=8", "anyio>=4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "anyio",
    "integration: needs PostgreSQL (see README)",
]
